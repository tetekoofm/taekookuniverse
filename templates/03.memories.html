<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taekook Universe Galaxy</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
</head>

<body>
  <!-- <div class="main-content">
    <h1 class="heading">✨ Memories ✨</h1>
    <p class="caption">Click a galaxy to begin exploring.</p>
  </div> -->
  <a href="{{ url_for('home') }}">
    <img src="{{ url_for('static', filename='images/fanbases/tku.webp') }}" id="TKULogo">
  </a>

  <canvas id="galaxyCanvas"></canvas>

  <div id="leftEventsPanel"></div>
  <div id="rightEventsPanel"></div>
  <div id="eventModal"></div>

<script>
const canvas = document.getElementById('galaxyCanvas');
const ctx = canvas.getContext('2d');

const leftPanel = document.getElementById('leftEventsPanel');
const rightPanel = document.getElementById('rightEventsPanel');
const eventModal = document.getElementById('eventModal');

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

/* ---------------- DEVICE ---------------- */
const isMobile = () => window.innerWidth < 768;

const ORBIT_BASE = () => isMobile() ? 90 : 180;
const ORBIT_STEP = () => isMobile() ? 35 : 60;
const YEAR_FONT = () => {
  if (isMobile()) return 18;        // smaller mobile label
  return Math.min(34, canvas.width * 0.03);  // reduced desktop size
};
const MONTH_FONT = () => isMobile() ? 11 : 16;

/* ---------------- DATA ---------------- */
const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const events = {{ events|tojson }};

/* ---------------- GROUP DATA ---------------- */
const yearData = {};
events.forEach(ev=>{
  const [y,m] = ev.date.split('-');
  const year = +y;
  const month = monthNames[+m-1];

  if(!yearData[year]) yearData[year] = {months:{}};
  if(!yearData[year].months[month]) yearData[year].months[month] = [];
  yearData[year].months[month].push(ev);
});

/* ---------------- GALAXIES ---------------- */
const galaxies = [];
const margin = window.innerWidth < 768 ? 80 : 150;

const placed = [];

function getMinDist() {
  if (window.innerWidth < 768) return 120;  // mobile tighter but safe
  if (window.innerWidth < 1200) return 170;
  return 200;
}

function isTooClose(x, y) {
  const minDist = getMinDist();
  return placed.some(p => Math.hypot(p.x - x, p.y - y) < minDist);
}

Object.keys(yearData).sort().forEach(year=>{
  let x, y;
  let tries = 0;

  do {
    x = margin + Math.random() * (canvas.width - margin * 2);
    y = margin + Math.random() * (canvas.height - margin * 2);
    tries++;
  } while (isTooClose(x, y) && tries < 50);

  placed.push({ x, y });

  const monthEvents = yearData[year].months;
  const numEvents = Object.values(monthEvents).reduce((a, b) => a + b.length, 0);

  const stars = [];
  const arms = 3;

  for(let i=0;i<30+numEvents*3;i++){
    stars.push({
      arm: Math.floor(Math.random()*arms),
      radius: 15 + Math.random()*90,
      t: Math.random()*Math.PI*2,
      size: Math.random()*1.5+0.5,
      color:`hsla(${Math.random()*360},80%,60%,0.6)`
    });
  }

  galaxies.push({
    year,
    x,
    y,
    monthEvents,
    stars: stars,
    arms: 3,
    rotation: Math.random() * Math.PI * 2,
    opacity: 1,
    selected:false
  });
});

/* ---------------- BACKGROUND STARS (RESTORED) ---------------- */
const bgStars = Array.from({length:600},()=>({
  x:Math.random()*canvas.width,
  y:Math.random()*canvas.height,
  r:Math.random()*1.5,
  dx:(Math.random()-0.5)*0.05,
  dy:(Math.random()-0.5)*0.05
}));

function drawBackground(){
  ctx.fillStyle = "black";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#fff";
  bgStars.forEach(s=>{
    s.x += s.dx;
    s.y += s.dy;

    if(s.x < 0) s.x = canvas.width;
    if(s.x > canvas.width) s.x = 0;
    if(s.y < 0) s.y = canvas.height;
    if(s.y > canvas.height) s.y = 0;

    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  });
}

function drawConstellations(){

galaxies.forEach((g,i)=>{

  if(!galaxies[i+1]) return;

  const next = galaxies[i+1];

  ctx.beginPath();
  ctx.moveTo(g.x,g.y);
  ctx.lineTo(next.x,next.y);

  if(selectedGalaxy === g || selectedGalaxy === next){
    ctx.strokeStyle = `rgba(15,255,80,${0.3 + Math.sin(constellationPulse)*0.15})`;
    ctx.lineWidth = 2;
  }
  else{
    ctx.strokeStyle = "rgba(168,85,247,0.18)";
    ctx.lineWidth = 1;
  }

  ctx.setLineDash([6,12]);
  ctx.stroke();
  ctx.setLineDash([]);

});

}

/* ---------------- STATE ---------------- */
let selectedGalaxy = null;
let planetCache = {};
let constellationPulse = 0;
let currentMemoryList = [];
let currentMemoryIndex = 0;
let selectedYearEvents = [];
/* ---------------- Animate Galaxy ---------------- */
function animateGalaxySelection(target){
  galaxies.forEach(g=>{
      if(target === g){
          g.opacity = 1;
          g.selected = true;
      }
      else{
          g.opacity = 0.12;
          g.selected = false;
      }
  });
}

/* ---------------- DRAW LOOP ---------------- */
function draw(){
  drawBackground();
  constellationPulse += 0.03;
  drawConstellations();

  galaxies.forEach(g=>{
    ctx.globalAlpha = g.opacity || 1;
    if(!selectedGalaxy || selectedGalaxy===g){
      g.rotation += 0.00003;
    }

    /* spiral stars */
    g.stars.forEach(s=>{
      s.t += 0.0003;

      const angle = s.t + s.arm*2*Math.PI/g.arms + g.rotation;
      const r = s.radius * (1 + Object.keys(g.monthEvents).length*0.02);

      const x = g.x + r*Math.cos(angle);
      const y = g.y + r*Math.sin(angle);

      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x+2,y+2);
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.size;
      ctx.stroke();
    });

    const glowSize = selectedGalaxy === g ? 130 : 90;

    const glow = ctx.createRadialGradient(
        g.x,
        g.y,
        10,
        g.x,
        g.y,
        glowSize
    );

    glow.addColorStop(0,"rgba(168,85,247,.65)");
    glow.addColorStop(.4,"rgba(15,255,80,.25)");
    glow.addColorStop(1,"rgba(0,0,0,0)");

    ctx.beginPath();
    ctx.fillStyle = glow;
    ctx.arc(g.x,g.y,glowSize,0,Math.PI*2);
    ctx.fill();
    
    if(selectedGalaxy === g){
      ctx.beginPath();
      ctx.arc(
          g.x,
          g.y,
          110,
          0,
          Math.PI * 2
      );

      ctx.strokeStyle = "rgba(15,255,80,0.5)";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([8,8]);
      ctx.stroke();
      ctx.setLineDash([]);
      }

    /* year */
    ctx.textAlign = "center";
    ctx.font = `${YEAR_FONT()}px Orbitron`;
    ctx.shadowBlur = selectedGalaxy === g ? 35 : 20;
    ctx.shadowColor = selectedGalaxy === g ? "#10ff50" : "#a855f7";
    ctx.fillStyle = "#fff";
    ctx.fillText(g.year,g.x,g.y);
    ctx.shadowBlur = 0;

    /* planets */
    if(selectedGalaxy===g){
      Object.keys(g.monthEvents).forEach((m,i)=>{

        const count = g.monthEvents[m].length;
        const ORBIT_BASE = () => isMobile() ? 70 : 150;
        const ORBIT_STEP = () => isMobile() ? 28 : 55;
        const orbit = ORBIT_BASE() + i * (ORBIT_STEP() * 0.65);
        const speed = 0.00005 / (i + 1);

        const angle = (performance.now()*speed + i) % (Math.PI*2);

        const px = g.x + orbit*Math.cos(angle);
        const py = g.y + orbit*Math.sin(angle);

        const r = 6 + count * 0.8;

        planetCache[g.year+"-"+m] = {x:px,y:py,r};

        ctx.beginPath();
        ctx.arc(px,py,r,0,Math.PI*2);
        ctx.fillStyle = `hsl(${i*30},80%,60%)`;
        ctx.fill();

        ctx.fillStyle = "#fff";
        ctx.font = `${MONTH_FONT()}px Orbitron`;
        ctx.fillText(m, px, py - (r + 8));
      });
    }
    ctx.globalAlpha = 1;
  });

  requestAnimationFrame(draw);
}
draw();

/* ---------------- CLICK FIX ---------------- */
canvas.addEventListener('click',(e)=>{

  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  galaxies.forEach(g=>{

    const dx = x - g.x;
    const dy = y - g.y;

    /* year click */
    if(Math.hypot(dx,dy) < 50){

      if(selectedGalaxy === g){
        selectedGalaxy = null;
        galaxies.forEach(g=>{
            g.scale = 1;
            g.opacity = 1;
        });
        }
        else{
        selectedGalaxy = g;
        animateGalaxySelection(g);
      }

      leftPanel.style.display = "none";
      leftPanel.innerHTML = "";

      rightPanel.style.display = "none";
      rightPanel.innerHTML = "";

      return;
    }

    /* month click */
    if(selectedGalaxy===g){
      Object.keys(g.monthEvents).forEach(m=>{
        const p = planetCache[g.year+"-"+m];
        if(!p) return;

        if(Math.hypot(x-p.x, y-p.y) < p.r){
          showEvents(g.monthEvents[m], m, g.year);
        }
      });
    }
  });
});

/* ---------------- PANEL ---------------- */
function showEvents(events,month,year){

currentMemoryList = events;

leftPanel.innerHTML = `<h3>${month} ${year}</h3>`;
leftPanel.style.display = "block";

events.sort((a,b)=>new Date(a.date)-new Date(b.date));

events.forEach((ev,index)=>{

  const div = document.createElement("div");

  div.innerHTML = `
    <div class="event-row">
      <div class="date-box">${new Date(ev.date).getDate()}</div>

      <img
        src="/static/images/memories/${ev.image || 'placeholder.jpg'}"
        class="event-thumb"
        alt="${ev.title}"
      >

      <div class="event-title">${ev.title}</div>
    </div>
  `;

  div.onclick = ()=>{
    selectedYearEvents = events;
    currentMemoryIndex = events.indexOf(ev);
    showModal(ev);
  };

  leftPanel.appendChild(div);

});
}

/* ---------------- MODAL ---------------- */
function showModal(ev){

let imageHtml = "";

if (ev.image) {
  imageHtml = `
    <img
      src="/static/images/memories/${ev.image}"
      alt="${ev.title}"
      class="memory-image"
    >
  `;
}

const isFirst = currentMemoryIndex === 0;
const isLast = currentMemoryIndex === selectedYearEvents.length - 1;

eventModal.innerHTML = `
  <div class="modal-content">
    ${imageHtml}

    <h2>${ev.title}</h2>
    <p>${ev.description}</p>

    <div class="memory-navigation">
      <button 
        id="prevMemory"
        ${isFirst ? "disabled" : ""}
      >
        ← Previous
      </button>

      <button 
        id="nextMemory"
        ${isLast ? "disabled" : ""}
      >
        Next →
      </button>
    </div>

    <button class="close-btn" id="closeModal">Close</button>
  </div>
`;

eventModal.style.display = "block";

document.getElementById("closeModal").onclick = closeModal;

document.getElementById("prevMemory").onclick = ()=>{
  if(currentMemoryIndex > 0){
    currentMemoryIndex--;
    showModal(selectedYearEvents[currentMemoryIndex]);
  }
};

document.getElementById("nextMemory").onclick = ()=>{
  if(currentMemoryIndex < selectedYearEvents.length - 1){
    currentMemoryIndex++;
    showModal(selectedYearEvents[currentMemoryIndex]);
  }
};
}

function closeModal(){
  eventModal.style.display = "none";
  eventModal.innerHTML = "";
}

</script>
</body>
</html>
