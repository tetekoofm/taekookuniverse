{% extends "00.base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/memory_game.css') }}">
{% endblock %}

{% block title %}Taekook Memory Flip{% endblock %}

{% block content %}
<div class="memory-page">
    <h1>🐰 Taekook Memory Flip 💜</h1>
    <div id="difficulty-select">
        <h2>Choose Difficulty</h2>
        <button onclick="startGame('easy')">💚 Easy</button>
        <button onclick="startGame('difficult')">💜 Difficult</button>
    </div>
    
    <div id="game-area" style="display:none;">
        <div id="level-text"></div>
        <div id="game-board"></div>
        <div id="message"></div>
    </div>
</div>

<script>
    window.memoryImages = {{ images | tojson }};
    console.log("Template images:", window.memoryImages);
</script>

<script src="/static/js/memory_game.js"></script>

{% endblock %}
